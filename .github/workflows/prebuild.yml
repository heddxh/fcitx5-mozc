name: prebuild

on:
  workflow_dispatch:

jobs:
  prebuild:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Setup User
        run: |
          useradd -m builduser

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm base-devel git bazel python

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Patch
        run: |
          # Accelerate build by removing irrelevant compilers.
          git apply --directory=protobuf patches/protobuf.patch

      - name: Build data
        working-directory: mozc/src
        run: |
          chown -R builduser:builduser .
          sudo -u builduser bazel build --config oss_linux --host_cxxopt=-Wno-uninitialized //data_manager/oss:mozc_data.inc
          mkdir -p ../../build/release
          cp bazel-bin/data_manager/oss/mozc_data.inc ../../build/release/mozc_data.inc
          cp bazel-bin/data_manager/oss/mozc.data ../../build/release/mozc.data

      - name: Build UT data
        env:
          BAZEL_USER: builduser
        run: .github/mozc-ut/build-data.sh

      - name: Prepare UT release assets
        run: |
          cp build/mozc-ut/mozc_data.inc build/release/mozc_ut_data.inc
          cp build/mozc-ut/mozc.data build/release/mozc_ut.data
          cp build/mozc-ut/mozc-ut-data.txt build/release/mozc-ut-data.txt

      - name: Release data
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          commit: ${{ github.sha }}
          allowUpdates: true
          artifactErrorsFailBuild: true
          prerelease: true
          name: Nightly Build
          artifacts: build/release/*

      - name: Setup tmate session
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3
